<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Location Sharing Application</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      body {
        margin: 0;
        font-family:
          Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          sans-serif;
      }

      header {
        align-items: center;
        border-bottom: 1px solid #d4d4d4;
        display: flex;
        height: 10vh;
        justify-content: space-between;
        padding: 0 16px;
      }

      #map {
        height: 90vh;
      }

      button {
        background: #111827;
        border: 0;
        color: white;
        cursor: pointer;
        padding: 8px 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <strong>Location Sharing</strong>
        <span id="current-user"></span>
      </div>
      <form method="post" action="/auth/logout">
        <button type="submit">Logout</button>
      </form>
    </header>
    <div id="map"></div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
      const socket = io();
      const map = L.map('map').setView([51.505, -0.09], 13);

      const remoteMarkers = new Map();

      fetch('/api/me')
        .then((response) => response.json())
        .then(({ user }) => {
          document.getElementById('current-user').textContent =
            ` - ${user.name ?? user.email ?? user.sub}`;
        });

      socket.on('connect_error', () => {
        window.location.href = '/auth/login';
      });

      socket.on('server:location:update', (data) => {
        const { id, name, email, latitude, longitude } = data;
        const label = name ?? email ?? id;
        if (!remoteMarkers.has(id)) {
          const marker = L.marker([latitude, longitude])
            .addTo(map)
            .bindPopup(label);
          remoteMarkers.set(id, marker);
        } else {
          const existingMarker = remoteMarkers.get(id);
          existingMarker.setLatLng([latitude, longitude]);
          existingMarker.setPopupContent(label);
        }
      });

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution:
          '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      }).addTo(map);

      function getUsersCurrentLocation() {
        return new Promise((res, rej) => {
          if ('geolocation' in navigator) {
            navigator.geolocation.getCurrentPosition(
              (position) => {
                console.log(`Got user's location`, position);
                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;
                res({ latitude, longitude });
              },
              (err) => {
                rej(err);
              },

              { enableHighAccuracy: true },
            );
          } else {
            alert('Geolocation is not available in this browser');
          }
        });
      }

      let myCurrentLocationMarker = null;

      function updateMyLocationMarker(latitude, longitude) {
        if (!myCurrentLocationMarker) {
          myCurrentLocationMarker = L.marker([latitude, longitude])
            .addTo(map)
            .bindPopup('You are here');
        } else {
          myCurrentLocationMarker.setLatLng([latitude, longitude]);
        }
      }

      async function main() {
        const { latitude, longitude } = await getUsersCurrentLocation();
        socket.emit('client:location:update', { latitude, longitude });
        map.setView([latitude, longitude], 15);
        updateMyLocationMarker(latitude, longitude);

        setInterval(async () => {
          const { latitude, longitude } = await getUsersCurrentLocation();
          socket.emit('client:location:update', { latitude, longitude });
          updateMyLocationMarker(latitude, longitude);
        }, 10 * 1000);
      }

      window.addEventListener('load', main);
    </script>
  </body>
</html>
